[program:axionyx-queue]
process_name=%(program_name)s
command=php /var/www/axionyx/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/axionyx-queue.log
stopwaitsecs=3600
